name: Post-Deployment Verification

on:
  workflow_call:
    inputs:
      target-environment:
        required: true
        type: string
        description: "Target environment name (staging or production)"
      target-app-url:
        required: true
        type: string
        description: "Target frontend URL"
      target-api-url:
        required: true
        type: string
        description: "Target API Gateway URL"
  workflow_dispatch:
    inputs:
      target-environment:
        required: true
        type: string
        default: "staging"
      target-app-url:
        required: true
        type: string
        default: "https://staging.hopper.dev"
      target-api-url:
        required: true
        type: string
        default: "https://api-staging.hopper.dev"

permissions:
  contents: read

jobs:
  verify-deployment:
    name: Post-Deployment Smoke & Telemetry Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Verification Scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Execute Deployment Verification Protocol
        run: |
          echo "================================================================================"
          echo "  POST-DEPLOYMENT VERIFICATION: ${{ inputs.target-environment }}"
          echo "  App URL: ${{ inputs.target-app-url }}"
          echo "  API URL: ${{ inputs.target-api-url }}"
          echo "================================================================================"

          # Run automated smoke test script
          bash scripts/ci/verify-deployment.sh \
            "${{ inputs.target-app-url }}" \
            "${{ inputs.target-api-url }}" \
            "${{ inputs.target-environment }}"
