name: Pull Request Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI Gate
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI Gate
    uses: ./.github/workflows/frontend-ci.yml

  database-migrations:
    name: Database Migrations Gate
    uses: ./.github/workflows/database-migrations.yml

  integration-tests:
    name: Integration & RLS Isolation Gate
    uses: ./.github/workflows/integration-tests.yml
    needs: [backend-ci, database-migrations]

  security:
    name: Security & Secret Scan Gate
    uses: ./.github/workflows/security.yml

  pr-gate-summary:
    name: PR Merge Quality Verdict
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, database-migrations, integration-tests, security]
    if: always()
    steps:
      - name: Evaluate Required Gates
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.database-migrations.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ ONE OR MORE PR QUALITY GATES FAILED"
            exit 1
          fi
          echo "✔ ALL REQUIRED PR QUALITY GATES PASSED (100%)"
