name: Backend CI Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Backend Typecheck & Lint (tsc --noEmit)
        run: npm --prefix backend run lint

      - name: Backend Unit Tests (Fast Suites)
        run: |
          npx vitest run \
            tests/scrubber.test.ts \
            tests/parser.test.ts \
            tests/flakiness.test.ts \
            tests/fingerprint.test.ts \
            tests/quota-guard.test.ts
        working-directory: backend
        env:
          NODE_ENV: test
          AI_PROVIDER: deterministic

      - name: Verify Backend Multi-Stage Dockerfile
        run: docker build -t hopper-backend:ci ./backend
