name: Security & Vulnerability Scanning Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-and-dependency-scan:
    name: Secret Scanning & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies for Critical/High Vulnerabilities
        run: |
          echo "Running dependency vulnerability audit..."
          npm audit --omit=dev --audit-level=critical || true

      - name: Secret Scanning & Repository Cleanliness Guard
        run: |
          echo "Checking for committed secrets, tokens, or private keys..."
          python3 scripts/ci/verify-no-committed-secrets.py
