name: Security & Vulnerability Scanning Quality Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-and-dependency-scan:
    name: Secret Scanning & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies (critical/high)
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Repository cleanliness guard (project policy)
        run: python3 scripts/ci/verify-no-committed-secrets.py

      - name: Gitleaks — working tree secret scan
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Working tree only. Historical commits are covered separately by the
          # documented rotation runbook: those credentials are treated as
          # compromised and must be revoked, not merely deleted from history.
          /tmp/gitleaks detect --source . --no-git --redact --verbose

      - name: Verify no tracked environment files
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing env file tracked: $tracked"
            exit 1
          fi
          echo "No tracked .env files."
