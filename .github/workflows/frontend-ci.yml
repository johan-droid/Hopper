name: Frontend CI Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Lint, Build & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Contract & API Schema Tests
        run: npm run test:frontend

      - name: Frontend Production Bundle Build
        run: npm --prefix frontend run build

      - name: Verify Bundle Integrity & Security Headers
        run: |
          test -f frontend/dist/index.html || (echo "Missing index.html" && exit 1)
          test -f frontend/dist/_routes.json || (echo "Missing _routes.json" && exit 1)
          test -f frontend/dist/_headers || (echo "Missing _headers" && exit 1)
          echo "Frontend bundle verified successfully."
