name: Frontend CI Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Lint, Build & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Contract & API Schema Tests
        run: npm run test:frontend

      - name: Frontend Production Bundle Build
        run: npm --prefix frontend run build

      - name: Verify Bundle Integrity & Security Headers
        run: |
          test -f frontend/dist/index.html || (echo "Missing index.html" && exit 1)
          test -f frontend/dist/_routes.json || (echo "Missing _routes.json" && exit 1)
          test -f frontend/dist/_headers || (echo "Missing _headers" && exit 1)
          echo "Frontend bundle verified successfully."
