name: Dependency Security & Outdated Package Audit

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-dependencies:
    name: Audit & Report Outdated Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Root NPM Audit
        run: npm audit || true

      - name: Check Outdated Backend Packages
        run: |
          echo "=== Backend Outdated Dependencies ==="
          npm --prefix backend outdated || true

      - name: Check Outdated Frontend Packages
        run: |
          echo "=== Frontend Outdated Dependencies ==="
          npm --prefix frontend outdated || true

      - name: Run Quality Gate Smoke Tests
        run: |
          npm --prefix backend run lint
          npm run test:frontend
