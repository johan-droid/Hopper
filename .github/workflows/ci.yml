name: Hopper CI/CD Lifecycle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdlc-lifecycle:
    name: Complete Build Lifecycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Hopper Unified Lifecycle Pipeline
        run: npm --prefix backend run lifecycle

      - name: Verify Docker Build
        run: docker build -t hopper:latest ./backend
