name: Hopper CI/CD Lifecycle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdlc-lifecycle:
    name: Complete Build Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Hopper Unified Lifecycle Pipeline
        run: npm --prefix backend run lifecycle

      - name: Verify Docker Build
        run: docker build -t hopper:latest ./backend
