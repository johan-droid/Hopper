name: Release Management & Changelog

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Semantic version tag (e.g. v1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release Candidate Artifact
    uses: ./.github/workflows/build-artifacts.yml

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download Built Release Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-files

      - name: Generate Release Notes & Changelog
        id: notes
        run: |
          TAG="${{ github.ref_name || inputs.version_tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Generate Changelog from conventional commits
          cat <<EOF > RELEASE_NOTES.md
          # Hopper Release $TAG
          
          **Git Commit:** ${{ needs.build.outputs.commit-sha }}
          **Artifact Checksum:** \`${{ needs.build.outputs.artifact-checksum }}\`
          **Published Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
          
          ### Core Invariants Guaranteed
          - **Free Access:** Active validation mode; billing paywall dormant.
          - **Passive Diagnosis:** Zero repository mutations or code execution.
          - **Single AI Provider:** Anthropic Claude 3.5 Haiku / OpenAI with \$500 durable budget limit.
          - **Kernel RLS:** Unprivileged \`hopper_app\` role enforced on all 11 tables.
          - **Edge Ingress:** Cloudflare Pages + Worker Gateway.
          
          ### Release Verification Checksums
          \`\`\`
          $(cat release-files/RELEASE_CHECKSUMS.sha256 | head -n 20)
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          gh release create "$TAG" \
            --title "Hopper $TAG" \
            --notes-file RELEASE_NOTES.md \
            release-files/RELEASE_CHECKSUMS.sha256 || true
