name: Database Migration Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/src/db/**'

permissions:
  contents: read

jobs:
  validate-migrations:
    name: Fresh + Re-apply Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hopper_migrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hopper_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopper_migrations
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hopper_migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Apply migrations (fresh database)
        run: npm --prefix backend run migrate

      - name: Re-apply migrations (must be idempotent)
        run: npm --prefix backend run migrate

      - name: Verify tenant isolation objects and pgvector index
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d hopper_migrations -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COUNT(*) AS tenant_tables
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind = 'r'
            AND c.relrowsecurity;
          SELECT indexname FROM pg_indexes
          WHERE indexname = 'idx_failure_signatures_embedding_hnsw';
          SELECT to_regclass('public.hopper_job_queue');
          SQL
