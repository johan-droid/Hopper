name: Build Immutable Release Artifacts

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded release artifact"
        value: ${{ jobs.build-package.outputs.artifact-name }}
      artifact-checksum:
        description: "SHA-256 checksum of the release archive"
        value: ${{ jobs.build-package.outputs.artifact-checksum }}
      commit-sha:
        description: "Exact Git commit SHA packaged"
        value: ${{ jobs.build-package.outputs.commit-sha }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build & Checksum Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: hopper-release-${{ github.sha }}
      artifact-checksum: ${{ steps.checksum.outputs.hash }}
      commit-sha: ${{ github.sha }}

    steps:
      - name: Checkout Code at Exact Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Locked Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm --prefix frontend run build

      - name: Build Backend Bundles
        run: npm --prefix backend run build

      - name: Assemble Release Artifact Package
        run: |
          mkdir -p release-dist/frontend release-dist/backend release-dist/migrations release-dist/deploy
          
          # Copy Frontend Static Assets
          cp -r frontend/dist/* release-dist/frontend/
          
          # Copy Backend Bundles
          cp -r backend/dist/* release-dist/backend/
          cp backend/package.json release-dist/backend/
          
          # Copy Database Migrations
          cp -r backend/supabase/migrations/*.sql release-dist/migrations/
          
          # Copy Deployment Configs & Edge Worker
          cp deploy/cloudflare/worker.ts release-dist/deploy/
          cp wrangler.toml release-dist/
          
          # Generate Build Metadata Manifest
          cat <<EOF > release-dist/BUILD_METADATA.json
          {
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "node_version": "$(node --version)",
            "npm_version": "$(npm --version)"
          }
          EOF

      - name: Generate Cryptographic SHA-256 Checksums
        id: checksum
        run: |
          cd release-dist
          find . -type f -exec sha256sum {} + | sort > ../RELEASE_CHECKSUMS.sha256
          cd ..
          PACKAGE_HASH=$(sha256sum RELEASE_CHECKSUMS.sha256 | awk '{print $1}')
          echo "hash=$PACKAGE_HASH" >> $GITHUB_OUTPUT
          echo "Release Package Checksum: $PACKAGE_HASH"

      - name: Archive Immutable Release Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: hopper-release-${{ github.sha }}
          path: |
            release-dist/
            RELEASE_CHECKSUMS.sha256
          retention-days: 30
