name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Staging Release Candidate
    uses: ./.github/workflows/build-artifacts.yml

  deploy-to-staging:
    name: Deploy to Cloudflare Staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.hopper.dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Download Verified Release Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: staging-artifact

      - name: Verify Artifact Checksum
        run: |
          echo "Verifying artifact checksum before staging deployment..."
          cd staging-artifact/release-dist
          sha256sum -c ../RELEASE_CHECKSUMS.sha256
          echo "✔ Artifact integrity verified"

      - name: Deploy Frontend to Cloudflare Pages Staging
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Deploying verified frontend artifact to Cloudflare Pages (staging)..."
            npx wrangler pages deploy staging-artifact/release-dist/frontend \
              --project-name="hopper-frontend-staging" \
              --branch="staging" \
              --commit-dirty=true
          else
            echo "CLOUDFLARE_API_TOKEN secret not configured; skipping remote Pages push."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Edge Gateway Worker to Staging
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Deploying edge gateway to Cloudflare Workers (staging)..."
            npx wrangler deploy staging-artifact/release-dist/deploy/worker.ts \
              --config staging-artifact/release-dist/wrangler.toml \
              --env staging
          else
            echo "CLOUDFLARE_API_TOKEN secret not configured; skipping remote Worker deploy."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN_API_URL: ${{ secrets.STAGING_ORIGIN_API_URL || 'https://api-staging.hopper.dev' }}

  verify-staging:
    name: Staging Post-Deployment Health Check
    needs: [build, deploy-to-staging]
    uses: ./.github/workflows/post-deployment-verification.yml
    with:
      target-environment: "staging"
      target-app-url: "https://staging.hopper.dev"
      target-api-url: "https://api-staging.hopper.dev"
