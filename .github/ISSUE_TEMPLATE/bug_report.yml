name: Bug Report
description: Report an issue, unexpected failure, or error in Hopper.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! Please provide detailed technical evidence to help us reproduce and fix the defect.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the system component where the issue occurs.
      options:
        - "Ingestion / Webhooks (POST /api/webhooks/github)"
        - "Log Slicer / Secret Scrubber"
        - "Failure Fingerprinting / Deduplication"
        - "AI Diagnosis Engine / Budget Controller"
        - "Queue Processing / BullMQ Worker"
        - "PostgreSQL Database / RLS Policies"
        - "Frontend Dashboard / User Interface"
        - "Cloudflare Edge Gateway / Pages"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
      placeholder: "When submitting a CI failure webhook..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions or copy-pasteable commands.
      placeholder: |
        1. Start containers: docker compose up -d
        2. Execute: curl -X POST http://localhost:3000/api/...
        3. Observe error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have occurred.
      placeholder: "The webhook should be ingested and acknowledged with HTTP 202..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any terminal logs or stack traces. Secrets will be automatically scrubbed.
      render: shell

  - type: checkboxes
    id: sanity-check
    attributes:
      label: Sanity Checklist
      options:
        - label: "I have confirmed that no secrets, credentials, or private keys are included in this report."
          required: true
        - label: "I have verified that local Docker containers (PostgreSQL & Redis) are running and healthy."
          required: false
