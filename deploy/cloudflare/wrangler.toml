# Cloudflare Edge Gateway Configuration for Hopper
name = "hopper-edge"
main = "worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ORIGIN_API_URL = "https://api.hopper.dev"
ENABLE_EDGE_CACHE = "true"

[env.staging]
name = "hopper-edge-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
ORIGIN_API_URL = "https://api-staging.hopper.dev"
ENABLE_EDGE_CACHE = "true"

[env.development]
name = "hopper-edge-dev"
[env.development.vars]
ENVIRONMENT = "development"
ORIGIN_API_URL = "http://localhost:3000"
ENABLE_EDGE_CACHE = "false"

