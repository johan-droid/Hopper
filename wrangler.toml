# Cloudflare Edge Gateway Configuration for Hopper
name = "hopper-edge"
main = "deploy/cloudflare/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI Free Tier Binding (10,000 neurons/day)
[ai]
binding = "AI"

# Operational variables
[vars]
ENVIRONMENT = "production"
ORIGIN_API_URL = "https://api.hopper.dev"
ENABLE_EDGE_CACHE = "true"
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"

# Staging Environment
[env.staging]
name = "hopper-edge-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
ORIGIN_API_URL = "https://api-staging.hopper.dev"
ENABLE_EDGE_CACHE = "true"

# Local / Development Environment
[env.development]
name = "hopper-edge-dev"
[env.development.vars]
ENVIRONMENT = "development"
ORIGIN_API_URL = "http://localhost:3000"
ENABLE_EDGE_CACHE = "false"

