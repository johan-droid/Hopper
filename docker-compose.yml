version: '3.8'

services:
  # Hopper API & Webhook Gateway
  hopper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hopper-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@hopper-postgres:5432/hopper_db
      - REDIS_URL=redis://hopper-redis:6379
      - GITHUB_APP_WEBHOOK_SECRET=whsec_hopper_super_secret_signing_key_42
      - AI_PROVIDER=mock
    depends_on:
      hopper-postgres:
        condition: service_healthy
      hopper-redis:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL 16 with pgvector Extension
  hopper-postgres:
    image: pgvector/pgvector:pg16
    container_name: hopper-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hopper_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hopper_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for BullMQ Async Event Pipeline
  hopper-redis:
    image: redis:7-alpine
    container_name: hopper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
