version: '3.8'

# Hopper local infrastructure.
#
# PostgreSQL 16 + pgvector is the ONLY local container. The application runs
# through `npm run dev` (Vite + tsx + the durable queue worker). Redis and the
# Cloudflare tunnel are no longer part of the architecture.

services:
  hopper-postgres:
    image: pgvector/pgvector:pg16
    container_name: hopper-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hopper_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/supabase/migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/supabase/migrations/0002_hnsw_index.sql:/docker-entrypoint-initdb.d/02_hnsw_index.sql:ro
      - ./backend/supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hopper_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
